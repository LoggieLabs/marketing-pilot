<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicons are generated by scripts/generate-brand-assets.py from the site's
      own tokens and lattice motif. The icon these replace was a 424 KB, 543px
      PNG on a light ground — invisible on a light tab strip, far too detailed to
      resolve at 16px, and in a palette this site does not use. The set below is
      0.6-8 KB per file.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--
      CLAIM VOCABULARY — this document is held to the same ratified rules as the
      app's own shipped metadata (products/loggie-app/index.html):
        "tamper-evident"  — allowed
        "tamper-proof" / "unhackable" / "quantum-proof" — banned
      Every chain reference must carry the Sepolia qualifier. Nothing here may
      claim an audit, a mainnet deployment, or an npm package that does not exist.
    -->
    <title>Loggie — Keep your piece of history.</title>
    <meta name="title" content="Loggie — Keep your piece of history." />
    <meta
      name="description"
      content="Your photos, writing, files and conversations, kept somewhere that belongs to you. Private while it is yours, verifiable when it matters, and built to remain understandable after the platforms that made it are gone. Public beta on Ethereum's Sepolia test network, not independently audited."
    />
    <link rel="canonical" href="https://loggielabs.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loggie" />
    <meta property="og:url" content="https://loggielabs.com/" />
    <meta property="og:title" content="Loggie — Keep your piece of history." />
    <meta
      property="og:description"
      content="Your photos, writing, files and conversations, kept somewhere that belongs to you. Private while it is yours, verifiable when it matters, and built to remain understandable after the platforms that made it are gone. Public beta on Ethereum's Sepolia test network, not independently audited."
    />
    <meta property="og:image" content="https://loggielabs.com/loggie-share-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Loggie — keep your piece of history. Public beta on Ethereum's Sepolia test network, not independently audited." />

    <!-- X / Twitter. No twitter:site handle: no official account is recorded in
         this repo, and inventing one would mis-attribute the product. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loggie — Keep your piece of history." />
    <meta
      name="twitter:description"
      content="Your photos, writing, files and conversations, kept somewhere that belongs to you. Private while it is yours, verifiable when it matters, and built to remain understandable after the platforms that made it are gone. Public beta on Ethereum's Sepolia test network, not independently audited."
    />
    <meta name="twitter:image" content="https://loggielabs.com/loggie-share-card.png" />

    <meta name="theme-color" content="#07080C" />

    <!-- Typography. Inter was declared by the old stylesheet and never fetched,
         so most machines silently fell back to system-ui. It is loaded now.
         JetBrains Mono carries every address, CID, hash and block number —
         on this site monospace is content, not decoration. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Conservative JSON-LD. Only facts this repo can support. No ratings,
         pricing, reviews, awards or social accounts are asserted. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Loggie",
        "url": "https://loggielabs.com/",
        "description": "Your photos, writing, files and conversations, kept somewhere that belongs to you. Private while it is yours, verifiable when it matters, and built to remain understandable after the platforms that made it are gone. Public beta on Ethereum's Sepolia test network, not independently audited."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
